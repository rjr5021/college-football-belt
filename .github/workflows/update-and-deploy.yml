name: Update and deploy

# Runs the whole pipeline (refetch data, rebuild the site) and publishes
# the result to GitHub Pages -- on a schedule, on demand, and on every
# push to main. Unlike running update_all.py on your own computer, this
# runs on GitHub's own servers, so it doesn't need your machine to be on.
#
# One-time setup this workflow depends on:
#   1. Settings -> Pages -> Source -> "GitHub Actions".
#   2. Settings -> Secrets and variables -> Actions -> New repository
#      secret -> name it CFBD_API_KEY, value is your CFBD key.
#   3. OPTIONAL, for the AI-written upcoming-game preview and game recaps
#      -> same place -> New repository secret -> name it ANTHROPIC_API_KEY,
#      value is a key from console.anthropic.com. Everything else on the
#      site works fine without this one; skip it and generate_ai_preview.py
#      / generate_recaps.py just no-op.
#   4. OPTIONAL, to auto-post to X (@CollegeFBBelt) after every belt game
#      (both a change of holder AND a successful defense) plus a preview
#      post the Friday before each upcoming game -> same place -> four
#      more repository secrets: X_API_KEY, X_API_KEY_SECRET,
#      X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET, from the app's Keys & Tokens
#      page at developer.x.com. Skip any of the four and post_to_x.py just
#      no-ops -- nothing else on the site depends on it.
#   5. OPTIONAL, same idea but for Instagram (@CollegeFBBelt) -> same
#      place -> two more repository secrets: IG_ACCESS_TOKEN,
#      IG_BUSINESS_ACCOUNT_ID, from the app's Instagram API setup page at
#      developers.facebook.com ("Generate access tokens" step). Skip
#      either one and post_to_instagram.py just no-ops the same way.
# See README.md for the full walkthrough.
#
# CFBD's free tier is capped at 1,000 calls/MONTH (not a short burst
# limit), so this pipeline fetches only the current + previous season each
# run (~15-30 calls) instead of the whole 1869-now history (~600+ calls) --
# see README.md's "Incremental fetching" section. With 4 scheduled runs a
# week (see below) instead of 1, that's roughly 250-500 calls/month during
# the season just from the schedule -- comfortably under the cap, but
# worth knowing if you ever add more scheduled check-ins or run things
# manually a lot in the same month. That means
# historical_data/ (the small, git-committed baseline the scripts resume
# from) can change as seasons age out of the "current + previous" window,
# so this workflow commits that change back to the repo when it happens.
# Same idea for ai_preview_cache/ and recap_cache/ -- both are committed
# too, so the AI preview and the game recaps are only (re)generated
# (spending real API budget) when something actually changed since the
# last run, not on every run. Skipping this commit step for recap_cache/
# in particular would silently re-spend a full historical backfill's
# worth of Claude calls every single week, so all three caches are
# committed back the same way. social_cache/ is committed for the same
# reason again -- it's how post_to_x.py and post_to_instagram.py each
# remember which belt change they already posted about, so skipping this
# step would repost the same change on every single scheduled run instead
# of just once.

on:
  schedule:
    # Four check-ins per week instead of one, aimed at catching the belt
    # holder's own game (the only one that can actually change hands)
    # shortly after it ends, plus one overnight catch-all. GitHub Actions
    # cron is fixed-clock-time UTC only -- it can't dynamically compute
    # "4 hours after whenever this week's game kicks off," since that
    # time moves around week to week. These four approximate it instead,
    # spaced ~4 hours after the three standard college football kickoff
    # windows (noon / 3:30pm / primetime ET), so whichever slot the
    # holder's game lands in, one of these lands close to 4 hours after
    # its actual kickoff:
    #   - Sat 4:00pm ET  -- ~4h after a ~noon ET kickoff
    - cron: '0 21 * * 6'
    #   - Sat 7:30pm ET  -- ~4h after a ~3:30pm ET kickoff
    - cron: '30 0 * * 0'
    #   - Sat 11:30pm ET -- ~4h after a ~7:30pm ET primetime kickoff
    - cron: '30 4 * * 0'
    #   - Sun 1:00am ET  -- final overnight catch-all
    - cron: '0 6 * * 0'
    #   - Fri 6:00pm ET  -- dedicated run for the X preview post below;
    #     doesn't hurt to also pick up any last-minute data change before
    #     the weekend's games
    - cron: '0 23 * * 5'
    # All five are written for EST (UTC-5, winter clock) since that's
    # what was asked for -- during EDT (UTC-4, roughly late Aug into
    # early Nov), each of these actually lands ONE HOUR EARLIER on the
    # clock (e.g. the "1:00am ET" one fires at what's actually 12:00am
    # EDT). GitHub Actions cron has no timezone/DST awareness at all, so
    # there's no fixed UTC time that stays correct year-round -- this is
    # a real limitation, not a bug, and the gap is only ever an hour.
    # A Thursday/Friday game (occasional, mostly early season and
    # championship week) won't get its own near-real-time check -- it
    # just gets picked up at the next one of these five, same as any
    # in-progress week always has been. Use "Run workflow" below for an
    # on-demand check any time none of this fits.
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # needed to commit historical_data/ updates back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the full update pipeline (fetch data + rebuild site)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          # True only on the Friday 6pm ET cron line above -- that's the
          # one and only run meant to post the upcoming-game preview, on
          # both X and Instagram (post_to_instagram.py reads this same
          # flag, not a separate one -- see its docstring).
          # github.event.schedule tells us which cron line fired this run
          # (unset for workflow_dispatch/push, so those never post one).
          X_POST_PREVIEW: ${{ github.event.schedule == '0 23 * * 5' }}
        run: python update_all.py

      - name: Commit historical_data/, ai_preview_cache/, recap_cache/ and social_cache/ if any changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historical_data/
          if [ -d ai_preview_cache ]; then
            git add ai_preview_cache/
          fi
          if [ -d recap_cache ]; then
            git add recap_cache/
          fi
          if [ -d social_cache ]; then
            git add social_cache/
          fi
          if git diff --cached --quiet; then
            echo "No change to historical_data/, ai_preview_cache/, recap_cache/ or social_cache/ -- nothing to commit."
          else
            git commit -m "Advance historical baseline / AI preview + recap + social caches [skip ci]"
            git push
          fi

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
