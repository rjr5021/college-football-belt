name: Update and deploy

# Runs the whole pipeline (refetch data, rebuild the site) and publishes
# the result to GitHub Pages -- on a schedule, on demand, and on every
# push to main. Unlike running update_all.py on your own computer, this
# runs on GitHub's own servers, so it doesn't need your machine to be on.
#
# One-time setup this workflow depends on:
#   1. Settings -> Pages -> Source -> "GitHub Actions".
#   2. Settings -> Secrets and variables -> Actions -> New repository
#      secret -> name it CFBD_API_KEY, value is your CFBD key.
#   3. OPTIONAL, for the AI-written upcoming-game preview and game recaps
#      -> same place -> New repository secret -> name it ANTHROPIC_API_KEY,
#      value is a key from console.anthropic.com. Everything else on the
#      site works fine without this one; skip it and generate_ai_preview.py
#      / generate_recaps.py just no-op.
#   4. OPTIONAL, to auto-post to X (@CollegeFBBelt) after every belt game
#      (both a change of holder AND a successful defense) plus a preview
#      post the Friday before each upcoming game and a "game day -- the
#      belt is on the line" post at 10 AM ET on the day of each belt game
#      -> same place -> four more repository secrets: X_API_KEY,
#      X_API_KEY_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET, from the
#      app's Keys & Tokens page at developer.x.com. Skip any of the four
#      and post_to_x.py just no-ops -- nothing else on the site depends
#      on it.
#   5. OPTIONAL, same idea but for Instagram (@CollegeFBBelt) -> same
#      place -> two more repository secrets: IG_ACCESS_TOKEN,
#      IG_BUSINESS_ACCOUNT_ID, from the app's Instagram API setup page at
#      developers.facebook.com ("Generate access tokens" step). Skip
#      either one and post_to_instagram.py just no-ops the same way.
# See README.md for the full walkthrough.
#
# CFBD's free tier is capped at 1,000 calls/MONTH (not a short burst
# limit), so this pipeline fetches only the current + previous season each
# run (~15-30 calls) instead of the whole 1869-now history (~600+ calls) --
# see README.md's "Incremental fetching" section. With 4 scheduled runs a
# week (see below) instead of 1, that's roughly 250-500 calls/month during
# the season just from the schedule -- comfortably under the cap, but
# worth knowing if you ever add more scheduled check-ins or run things
# manually a lot in the same month. That means
# historical_data/ (the small, git-committed baseline the scripts resume
# from) can change as seasons age out of the "current + previous" window,
# so this workflow commits that change back to the repo when it happens.
# Same idea for ai_preview_cache/ and recap_cache/ -- both are committed
# too, so the AI preview and the game recaps are only (re)generated
# (spending real API budget) when something actually changed since the
# last run, not on every run. Skipping this commit step for recap_cache/
# in particular would silently re-spend a full historical backfill's
# worth of Claude calls every single week, so all three caches are
# committed back the same way. social_cache/ is committed for the same
# reason again -- it's how post_to_x.py and post_to_instagram.py each
# remember which belt change they already posted about, so skipping this
# step would repost the same change on every single scheduled run instead
# of just once.

on:
  schedule:
    # Four check-ins per week instead of one, aimed at catching the belt
    # holder's own game (the only one that can actually change hands)
    # shortly after it ends, plus one overnight catch-all. GitHub Actions
    # cron is fixed-clock-time UTC only -- it can't dynamically compute
    # "4 hours after whenever this week's game kicks off," since that
    # time moves around week to week. These four approximate it instead,
    # spaced ~4 hours after the three standard college football kickoff
    # windows (noon / 3:30pm / primetime ET), so whichever slot the
    # holder's game lands in, one of these lands close to 4 hours after
    # its actual kickoff:
    #   - Sat 4:00pm ET  -- ~4h after a ~noon ET kickoff
    - cron: '0 21 * * 6'
    #   - Sat 7:30pm ET  -- ~4h after a ~3:30pm ET kickoff
    - cron: '30 0 * * 0'
    #   - Sat 11:30pm ET -- ~4h after a ~7:30pm ET primetime kickoff
    - cron: '30 4 * * 0'
    #   - Sun 1:00am ET  -- final overnight catch-all
    - cron: '0 6 * * 0'
    #   - 2:00pm ET  -- dedicated run for the X preview post below;
    #     doesn't hurt to also pick up any last-minute data change before
    #     the weekend's games
    - cron: '0 18 * * 5'
    # Game-day mode (wishlist #3, 2026-09-16, Bob: "On Saturdays I want the
    # homepage to feel alive... it's just a different cron schedule on the
    # workflow you already have") -- these two lines add an hourly check-in
    # from noon to midnight ET every Saturday (13 runs), on top of the five
    # above. Every run is this exact same full pipeline; nothing about the
    # job changes for these -- fetch_gameday_status.py (added to
    # update_all.py's STAGES) makes its own two /scoreboard calls only when
    # today is actually the holder's own game day, and no-ops for free on
    # every single one of these hourly ticks during a bye week. On an
    # actual game day it's what lets the homepage show a live score and a
    # SAFE/IN DANGER read while the game's still being played -- the five
    # crons above already catch the game going FINAL within about 4 hours,
    # this is only for the in-between, still-live window they can't reach.
    #   - Sat noon-6pm ET  (17:00-23:00 UTC)
    - cron: '0 17-23 * * 6'
    #   - Sat 7pm-midnight ET  (00:00-05:00 UTC Sunday)
    - cron: '0 0-5 * * 0'
    # All seven are written for EST (UTC-5, winter clock) since that's
    # what was asked for -- during EDT (UTC-4, roughly late Aug into
    # early Nov), each of these actually lands ONE HOUR EARLIER on the
    # clock (e.g. the "1:00am ET" one fires at what's actually 12:00am
    # EDT). GitHub Actions cron has no timezone/DST awareness at all, so
    # there's no fixed UTC time that stays correct year-round -- this is
    # a real limitation, not a bug, and the gap is only ever an hour.
    # A Thursday/Friday game (occasional, mostly early season and
    # championship week) won't get its own near-real-time check -- it
    # just gets picked up at the next one of these seven, same as any
    # in-progress week always has been. Use "Run workflow" below for an
    # on-demand check any time none of this fits.
    #
    # Game-day morning (2026-09-19, Bob: "an automatic X post on the day
    # of each belt game, 10 ET... signifies it's game day and the belt is
    # on the line with some preview and game details") -- a daily 10:00 AM
    # ET check-in for the whole season, every day of the week because a
    # belt game can land on any of them (Thursday/Friday games, MACtion
    # Tuesdays, bowls, the Monday title game). Same full pipeline as every
    # other run -- so the site is also freshly rebuilt each morning with
    # that day's odds, kickoff/TV listings and forecast -- and then
    # post_to_x.py posts the game-day post only if today (Eastern) is the
    # holder's game day, and only once per game. Unlike the lines above,
    # this one is meant to land at a TRUE 10 AM ET year-round, which takes
    # two UTC times: 14:00 in daylight time (Aug-Oct), 15:00 in standard
    # time (Dec-Jan), and BOTH in November, which straddles the switch
    # (first Sunday). post_to_x.py gets the cron string that fired the
    # run (X_FIRED_CRON below) and posts only from the line that equals
    # 10:00 AM America/New_York on that date -- so on a November day
    # exactly one of the two fires the post and the other is an ordinary
    # rebuild. Feb-Jul (no games) get no morning run at all. Cost: one
    # extra pipeline run a day in season, two in November.
    #   - 10:00 AM EDT, Aug-Oct
    - cron: '0 14 * 8-10 *'
    #   - 10:00 AM ET, November (14:00 UTC before the clocks go back, 15:00 after)
    - cron: '0 14 * 11 *'
    - cron: '0 15 * 11 *'
    #   - 10:00 AM EST, Dec-Jan
    - cron: '0 15 * 12,1 *'
  workflow_dispatch:      # lets you trigger a run manually from the Actions tab
    inputs:
      full_refetch_game_details:
        description: >-
          Full refetch of every 2003+ belt game's box score (backfills
          CFBD's player id into older cached seasons so player names link
          on those games too -- see fetch_game_details.py's docstring).
          Only check this for that one-time backfill; it uses far more
          CFBD API calls (~600) than a normal run. Leave unchecked for an
          ordinary manual run.
        required: false
        type: boolean
        default: false
      bootstrap_losers_belt:
        description: >-
          One-time historical build of the Losers Belt, all three scopes
          -- Combined, FBS-only, FCS-only (see build_losers_lineage.py's
          docstring) -- required once before losers-belt.html/-fbs.html/
          -fcs.html ever appear on the site; every run after this one is
          cheap and automatic per scope. Also how to backfill fbs/fcs
          later without redoing combined's already-settled history. Uses
          far more CFBD API calls (~316 total, shared across all three
          scopes) than a normal run -- don't tick this in the same
          run/month as any other bootstrap checkbox on this form without
          checking your CFBD usage first. Leave unchecked for an ordinary
          manual run.
        required: false
        type: boolean
        default: false
      bootstrap_championship_scopes:
        description: >-
          One-time historical build of the championship belt's FBS-only
          and FCS-only scopes (see build_lineage.py's docstring) --
          required once before lineage_fbs.html/lineage_fcs.html and
          all-games_fbs.html/all-games_fcs.html ever appear on the site.
          The original combined scope (lineage.html/all-games.html, and
          everything else on the site) is untouched either way. Every run
          after this one is cheap and automatic per scope. Uses far more
          CFBD API calls (~316 total, shared across both scopes) than a
          normal run -- don't tick this in the same run/month as any
          other bootstrap checkbox on this form without checking your
          CFBD usage first. Leave unchecked for an ordinary manual run.
        required: false
        type: boolean
        default: false
      bootstrap_alternate_universes:
        description: >-
          One-time archive of every game since 1869 (all divisions) into
          historical_data/all_games.json.gz, which build_alternate_lineages.py
          needs to rerun the belt under alternate rules (ties pass the belt,
          bowls don't count, a 1936 or 1998 start) for universes/ on the
          site. Every run after this one recomputes those lineages for
          free from the archive. Uses far more CFBD API calls (~316) than
          a normal run -- don't tick this in the same run/month as any
          other bootstrap checkbox on this form without checking your
          CFBD usage first. Leave unchecked for an ordinary manual run.
        required: false
        type: boolean
        default: false
      bootstrap_conference_belts:
        description: >-
          One-time historical build of every FBS/FCS conference belt, all
          conferences together in one go (see
          build_conference_lineage.py's docstring) -- required once
          before conferences/index.html and any conferences/<slug>.html
          ever appear on the site. Eligibility is membership at the time
          of each game (CFBD's own per-game conference fields), so
          realignment is handled automatically. Every run after this one
          is cheap and automatic per conference; a no-op for any
          conference that's already bootstrapped, so re-ticking this
          later also backfills a newly-added conference on its own. Uses
          far more CFBD API calls (~316 total, shared across all
          conferences) than a normal run -- don't tick this in the same
          run/month as any other bootstrap checkbox on this form without
          checking your CFBD usage first. Leave unchecked for an ordinary
          manual run.
        required: false
        type: boolean
        default: false
      post_gameday:
        description: >-
          Post the "game day -- the belt is on the line" X post now, if
          today (Eastern) is the belt holder's game day and it hasn't
          gone out yet. Normally the 10 AM ET scheduled run does this on
          its own; tick this to send it by hand (e.g. that run failed, or
          you want it out at a different time today). Never posts twice
          for the same game, and does nothing on a day with no belt game.
          Leave unchecked for an ordinary manual run.
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # needed to commit historical_data/ updates back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the full update pipeline (fetch data + rebuild site)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          # True only on the Friday 2pm ET cron line above -- that's the
          # one and only run meant to post the upcoming-game preview, on
          # both X and Instagram (post_to_instagram.py reads this same
          # flag, not a separate one -- see its docstring).
          # github.event.schedule tells us which cron line fired this run
          # (unset for workflow_dispatch/push, so those never post one).
          X_POST_PREVIEW: ${{ github.event.schedule == '0 18 * * 5' }}
          # The cron line that fired this run, verbatim (empty for a push
          # or a manual run) -- post_to_x.py's game-day post fires only
          # from the one line that lands on 10:00 AM America/New_York on
          # that date, out of the four "game-day morning" lines above (see
          # the schedule comment and post_to_x.py's docstring for why the
          # script, not this file, makes that call).
          X_FIRED_CRON: ${{ github.event.schedule }}
          # Only set (to the string "true") on a manual "Run workflow" run
          # with the post_gameday checkbox ticked -- sends the game-day post
          # now (if today is game day and it hasn't gone out), skipping
          # only the 10 AM tick check above.
          X_POST_GAMEDAY: ${{ github.event.inputs.post_gameday }}
          # Only set (to the string "true") on a manual "Run workflow" run
          # with the full-refetch checkbox ticked -- see the input above
          # and update_all.py's own docstring/FULL_REFETCH_GAME_DETAILS.
          FULL_REFETCH_GAME_DETAILS: ${{ github.event.inputs.full_refetch_game_details }}
          # Same idea, for the Losers Belt's own one-time historical
          # bootstrap -- see the input above and update_all.py's own
          # docstring/BOOTSTRAP_LOSERS_BELT.
          BOOTSTRAP_LOSERS_BELT: ${{ github.event.inputs.bootstrap_losers_belt }}
          # Same idea, for the championship belt's fbs/fcs scopes -- see
          # the input above and update_all.py's own docstring/
          # BOOTSTRAP_CHAMPIONSHIP_SCOPES.
          BOOTSTRAP_CHAMPIONSHIP_SCOPES: ${{ github.event.inputs.bootstrap_championship_scopes }}
          # Same idea, for the FBS/FCS conference belts' one-time
          # historical bootstrap -- see the input above and
          # update_all.py's own docstring/BOOTSTRAP_CONFERENCE_BELTS.
          BOOTSTRAP_CONFERENCE_BELTS: ${{ github.event.inputs.bootstrap_conference_belts }}
          # Same idea, for the alternate-rule lineages' one-time archive
          # of every game since 1869 -- see the input above and
          # update_all.py's own docstring/BOOTSTRAP_ALTERNATE_UNIVERSES.
          BOOTSTRAP_ALTERNATE_UNIVERSES: ${{ github.event.inputs.bootstrap_alternate_universes }}
        run: python update_all.py

      - name: Commit historical_data/, ai_preview_cache/, recap_cache/ and social_cache/ if any changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historical_data/
          if [ -d ai_preview_cache ]; then
            git add ai_preview_cache/
          fi
          if [ -d recap_cache ]; then
            git add recap_cache/
          fi
          if [ -d social_cache ]; then
            git add social_cache/
          fi
          if git diff --cached --quiet; then
            echo "No change to historical_data/, ai_preview_cache/, recap_cache/ or social_cache/ -- nothing to commit."
          else
            git commit -m "Advance historical baseline / AI preview + recap + social caches [skip ci]"
            git push
          fi

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
